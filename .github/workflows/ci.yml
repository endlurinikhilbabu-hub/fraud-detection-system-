name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt
          pip install pytest httpx

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          echo "=== Python version ==="
          python --version

          echo "=== Pytest version ==="
          pytest --version

          echo "=== Project files ==="
          ls -la

          echo "=== Running tests ==="
          pytest -v -m "not integration" --tb=short
